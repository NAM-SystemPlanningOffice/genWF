{% extends 'base.html' %}

{% block title %}404 Not Found{% endblock %}

{% block content %}
<style>
    .error-container {
        text-align: center;
        padding: 4rem 2rem;
    }
    .error-container h1 {
        font-size: 6rem;
        margin: 0;
        color: #e74c3c;
    }
    .error-container h2 {
        color: #2c3e50;
    }
</style>

<div class="error-container">
    <h1>404</h1>
    <h2>ページが見つかりません</h2>
    <p>お探しのページは存在しないか、移動した可能性があります。</p>
    <p><a href="{{ url_for('application.index') }}">トップページに戻る</a></p>
</div>
{% endblock %}
