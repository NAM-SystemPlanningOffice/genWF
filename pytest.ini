[pytest]
# Pytestの設定ファイル

# テストファイルの命名規則
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# テストディレクトリ
testpaths = tests

# 出力設定
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    --color=yes
    --cov=app
    --cov-report=html:htmlcov
    --cov-report=term-missing

# マーカー定義
markers =
    unit: 単体テスト（Models, Services, Utilsなど）
    integration: 統合テスト（Routes, DBアクセスなど）
    e2e: エンドツーエンドテスト（全体フロー）
    auth: 認証・認可関連テスト
    application: 申請機能テスト
    workflow: ワークフロー機能テスト
    approval: 承認機能テスト
    validation: バリデーション機能テスト
    admin: 管理機能テスト
    slow: 実行時間が長いテスト
    db: データベースアクセスを伴うテスト
    hybrid_db: ハイブリッドDBテスト（マスタ読み取り + トランザクション更新）
    visual: 画面イメージ保存テスト（HTML、スクリーンショット）
    selenium: Seleniumを使用したブラウザテスト

# 警告フィルター
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# カバレッジ除外パターン
[coverage:run]
omit =
    */venv/*
    */tests/*
    */migrations/*
    */__pycache__/*
    */site-packages/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstract
